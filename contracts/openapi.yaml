openapi: 3.1.0
info:
  title: BÉ VUI MẸ KHOẺ API
  version: 1.0.0
  description: Public catalogue and customer booking API baseline.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
security: []
paths:
  /public/branches:
    get:
      summary: List active branches
      responses:
        '200':
          description: Active branches
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code: { type: string }
                    name: { type: string }
                    city: { type: [string, 'null'] }
                    timezone: { type: string }
  /public/spa/services:
    get:
      summary: List published Spa services
      parameters:
        - in: query
          name: branchCode
          schema: { type: string, default: MAIN }
      responses:
        '200':
          description: Published Spa services. Empty until the official catalogue is configured.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code: { type: string }
                    name: { type: string }
                    description: { type: [string, 'null'] }
                    duration_minutes: { type: integer }
                    price: { type: [number, 'null'] }
                    currency: { type: string }
  /public/ticket-prices:
    get:
      summary: List active playground ticket prices
      parameters:
        - in: query
          name: branchCode
          schema: { type: string, default: MAIN }
      responses:
        '200':
          description: Dated ticket price rules
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ticket_code: { type: string }
                    ticket_name: { type: string }
                    duration_minutes: { type: [integer, 'null'] }
                    day_type: { type: string, enum: [WEEKDAY, WEEKEND, ALL] }
                    price: { type: number }
                    currency: { type: string }
  /public/play/slots:
    get:
      summary: List available configured capacity slots
      parameters:
        - in: query
          name: branchCode
          schema: { type: string, default: MAIN }
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Capacity slots for the selected branch-local date
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    starts_at: { type: string, format: date-time }
                    ends_at: { type: string, format: date-time }
                    remaining_capacity: { type: integer }
                    zone_name: { type: [string, 'null'] }
  /public/menu:
    get:
      summary: List published menu items
      parameters:
        - in: query
          name: branchCode
          schema: { type: string, default: MAIN }
      responses:
        '200':
          description: Published menu items and prices
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    category: { type: string }
                    name: { type: string }
                    description: { type: [string, 'null'] }
                    price: { type: number }
                    currency: { type: string }
                    is_available: { type: boolean }
  /customer/play-bookings:
    post:
      summary: Hold a playground ticket booking
      description: Requires a customer authentication identity linked to a guardian profile. Holds capacity for 15 minutes. The frontend preview does not call this endpoint yet; current HTTP Basic security is development-only.
      security:
        - basicAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, minLength: 12, maxLength: 100 }
          description: The body currently carries the idempotency key. The header is reserved for a later contract revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlayBookingRequest'
      responses:
        '200':
          description: Existing booking returned for an idempotent retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayBookingResponse' }
        '201':
          description: New capacity hold created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayBookingResponse' }
        '400':
          description: Invalid request or capacity unavailable
        '401':
          description: Authentication required
        '409':
          description: Capacity or idempotency conflict
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    CreatePlayBookingRequest:
      type: object
      required: [capacitySlotId, ticketTypeId, quantity, idempotencyKey]
      properties:
        capacitySlotId: { type: string, format: uuid }
        ticketTypeId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 20 }
        idempotencyKey: { type: string, minLength: 12, maxLength: 100 }
    PlayBookingResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        bookingCode: { type: string }
        unitPrice: { type: number }
        totalAmount: { type: number }
        quantity: { type: integer }
        status: { type: string }
        holdExpiresAt: { type: string, format: date-time }
        remainingCapacity: { type: integer }
